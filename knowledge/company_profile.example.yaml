# ============================================================================
# 我方条件（模板）—— 定位线的硬依赖输入
# ----------------------------------------------------------------------------
# ⚠️ 状态：本模板的字段结构是「样本归纳」产物（示例值来自水务场景），
#    已被 docs/company_profile-schema-v1.md 的「需求反推」字段定义取代。
#    schema-v1 审查冻结前，本文件仅供参考，不作为填表依据；
#    冻结后将按新结构重写本模板。
# ----------------------------------------------------------------------------
# 用法：复制本文件为 company_profile.yaml（同目录），填真实内容。
#   cp knowledge/company_profile.example.yaml knowledge/company_profile.yaml
#
# ⚠️ 红线：company_profile.yaml 含公司能力、商业模式、约束、历史判断，
#    属商业敏感信息。本仓库为 public，真实文件已被 .gitignore 排除。
#    若你改名或移动了真实文件，请同步更新 .gitignore 与 scripts/check_sensitive.sh。
#
# ⚠️ 本 example 文件是唯一入库的填表依据。真实文件被忽略后，新成员（或
#    未来的你）只能靠本文件的注释知道每个字段该填什么。注释不是可选项。
# ============================================================================

# ---------------------------------------------------------------------------
# static 块：agent 只读不写。
# 定位线对照它判断「我方适配度」，任何字段缺失都会让适配判断变成空泛建议。
# ---------------------------------------------------------------------------
static:
  # 公司现有能力：产线、渠道、客户、专利、资质。
  # 填得越具体，定位线「我方适配度」列的理由越可追溯（如「已有 XX 产线，
  # 切入该路线只需追加 YY 设备」），而不是「与公司能力匹配」这种废话。
  capabilities:
    production_lines: []    # 已有产线/中试装置，例：["50 m³/d 中试装置", "XX 产线"]
    channels: []            # 销售渠道/客户关系，例：["长江环保集团内部", "市政设计院"]
    customers: []           # 主要客户类型，例：["城镇污水厂", "工业园区"]
    patents: []             # 已有专利，例：["XX 工艺发明专利（ZL20XX...）"]
    certifications: []      # 资质，例：["市政公用工程施工总承包 X 级"]

  # 商业模式假设：卖什么、卖给谁、怎么收钱。决定定位线给「推荐」还是「观望」。
  business_model:
    sells: ""               # 卖什么，例："侧流生物增强工艺包 + 技术服务"
    to_whom: ""             # 卖给谁，例："集团内部污水厂 → 外部市政客户"
    revenue: ""             # 怎么收钱，例："工艺包一次性 + 年度技术服务费"

  # 约束：预算、时间、不能碰的红线。定位线不得推荐违反约束的路线。
  constraints:
    budget_max: ""          # 预算上限，例："单课题 ≤300 万元"
    time_limit: ""          # 时间约束，例："18 个月内须完成中试验证"
    forbidden: []           # 红线，例：["不触碰已有专利覆盖区", "不做需新征地项目"]

  # 决策要回答的问题：决定学术线与市场线的权重。
  # 例："要不要立项" → 两线等权；"技术是否成熟可引进" → 学术线加重。
  decision_questions: []

# ---------------------------------------------------------------------------
# dynamic 块：agent 可提议追加，但必须走记忆库 pending 流程
# （LLM 只提议、人工确认后生效），防止我方条件被错误自动更新污染后续定位。
# ---------------------------------------------------------------------------
dynamic:
  # 历史判断：以前评估过/否掉过什么方向、为什么。
  # agent 跑完会提议追加新判断，你确认后才进这里。
  past_judgments: []
  # 例：
  #   - direction: "XX 高级氧化工艺"
  #     verdict: rejected
  #     reason: "成本超预算上限 2 倍，且核心专利在竞品手中"
  #     date: "2026-06"
