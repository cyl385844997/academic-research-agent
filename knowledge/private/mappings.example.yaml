# L3 敏感代号映射 —— 模板。真实文件 mappings.yaml 已被 .gitignore 排除。
# 机制说明与三约束见 docs/company_profile-schema-v1.md 第 5 节。
#
# 三约束（全部满足才启用；任一做不到 → 删除 L3 字段，宁可少字段不要泄漏字段）：
#   1. 位置：真实映射只放本目录（knowledge/private/），不与 profile 同目录
#   2. 稳定：代号一旦对应某理由，永不重编号（理由文本修订只改映射值，不改号）
#   3. 无语义：禁止 EX-膜-001 式编码——代号本身不得泄露任何信息
#
# 用法：profile 的 exclusions 列表里只写 {code: EX-001, label: <术语表标签>}，
#       真实理由在本文件登记。定位线运行时两文件合读（本地）。
exclusions:
  EX-001: "（示例占位）某历史否决理由的通用描述——真实文件里写代号→理由映射"
